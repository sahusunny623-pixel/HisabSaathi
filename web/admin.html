<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HisabSaathi Owner Admin</title><style>body{font-family:system-ui;margin:0;background:#f5f7f6;color:#17352c}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dce5e1;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#eef6f2;padding:15px;border-radius:12px}.stat b{display:block;font-size:26px}.btn{padding:9px 12px;border:0;border-radius:9px;background:#123c2f;color:white;font-weight:700}.danger{background:#b42318}.input{padding:10px;width:100%;box-sizing:border-box;border:1px solid #ccd8d3;border-radius:9px;margin:6px 0}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #e4ebe7;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.table{font-size:12px}}</style></head><body><div class="wrap"><h1>HisabSaathi Owner Admin</h1><p>Payment verification और Premium control.</p><input id="secret" class="input" placeholder="ADMIN_VERIFY_SECRET" type="password"><button class="btn" onclick="load()">Load Dashboard</button><div id="stats" class="grid"></div><div class="card"><h2>Payment Claims</h2><div id="payments"></div></div><div class="card"><h2>Profiles</h2><div id="profiles"></div></div></div><script>const $=s=>document.querySelector(s);async function api(p,o={}){const r=await fetch('/api'+p,{...o,headers:{'Content-Type':'application/json','x-admin-verify-secret':$('#secret').value}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{const s=await api('/admin/stats');stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class="stat">${k}<b>${v}</b></div>`).join('');const p=await api('/admin/payments');payments.innerHTML='<table class="table"><tr><th>Profile</th><th>Shop</th><th>UTR</th><th>Status</th><th>Action</th></tr>'+p.payments.map(x=>`<tr><td>${x.profile_id}</td><td>${x.shop_name}</td><td>${x.provider_ref||'-'}</td><td>${x.status}</td><td>${x.status==='pending_verification'?`<button class="btn" onclick="verify('${x.id}',true)">Approve</button> <button class="btn danger" onclick="verify('${x.id}',false)">Reject</button>`:''}</td></tr>`).join('')+'</table>';const pr=await api('/admin/profiles');profiles.innerHTML='<table class="table"><tr><th>Profile</th><th>Shop</th><th>Status</th><th>Action</th></tr>'+pr.profiles.map(x=>`<tr><td>${x.profile_id}</td><td>${x.name}</td><td>${x.subscription_status}</td><td><button class="btn" onclick="activate('${x.profile_id}')">30 Days</button> <button class="btn danger" onclick="disableP('${x.profile_id}')">Disable</button></td></tr>`).join('')+'</table>'}catch(e){alert(e.message)}}async function verify(id,approved){await api('/admin/payments/'+id+'/verify',{method:'POST',body:JSON.stringify({approved})});load()}async function disableP(id){await api('/admin/profiles/'+id+'/disable',{method:'POST'});load()}async function activate(id){await api('/admin/profiles/'+id+'/activate',{method:'POST'});load()}</script></body></html>
