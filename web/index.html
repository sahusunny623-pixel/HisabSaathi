<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c2f"><title>HisabSaathi — दुकान का पूरा हिसाब</title><link rel="manifest" href="/manifest.webmanifest"><style>:root{--g:#123c2f;--g2:#1e6b52;--y:#f4b942;--bg:#f6f8f7;--card:#fff;--text:#17352c;--muted:#6d7d76;--danger:#b42318;--line:#dce5e1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{background:var(--g);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px #123c2f0c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stat{padding:18px;border-radius:16px;background:#eef6f2}.stat b{font-size:28px;display:block;margin-top:6px}.muted{color:var(--muted)}.btn{padding:11px 15px;border-radius:11px;background:var(--g);color:#fff;font-weight:700}.btn.alt{background:#edf3f0;color:var(--g)}.btn.yellow{background:var(--y);color:#172c24}.btn.danger{background:#feeceb;color:var(--danger)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.hidden{display:none!important}.langlist{max-height:360px;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.lang{padding:12px;border:1px solid var(--line);border-radius:10px;background:white;text-align:left}.hero{text-align:center;padding:45px 20px}.logo{width:72px;height:72px;border-radius:20px;background:var(--g);color:white;display:grid;place-items:center;margin:auto;font-size:32px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf3f0;font-size:12px;font-weight:700}.premium{border:2px solid var(--y);background:#fffaf0}.qr{max-width:240px;width:100%;display:block;margin:12px auto;border-radius:12px;border:1px solid var(--line)}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:20}.modal>.card{max-width:520px;width:100%;max-height:90vh;overflow:auto}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.wrap{padding:14px}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr}.langlist{grid-template-columns:1fr}}</style></head><body><div id="app"></div><div id="modal"></div><script>const LANGS=[['hi','हिन्दी'],['en','English'],['bn','বাংলা'],['te','తెలుగు'],['mr','मराठी'],['ta','தமிழ்'],['gu','ગુજરાતી'],['ur','اردو'],['kn','ಕನ್ನಡ'],['or','ଓଡ଼ିଆ'],['ml','മലയാളം'],['pa','ਪੰਜਾਬੀ'],['as','অসমীয়া'],['ma','मैथिली'],['sa','संस्कृतम्'],['ks','कश्मीरी'],['ne','नेपाली'],['sd','सिन्धी'],['kok','कोंकणी'],['doi','डोगरी'],['mni','মৈতৈলোন্'],['sat','संताली'],['bho','भोजपुरी']];let lang=localStorage.getItem('hs_lang')||'';let token=localStorage.getItem('hs_token')||'';let shop=JSON.parse(localStorage.getItem('hs_shop')||'null');const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});async function api(path,opt={}){const r=await fetch('/api'+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Request failed'),{status:r.status});return j}function chooseLang(){app.innerHTML='<div class="wrap"><div class="card hero"><div class="logo">₹</div><h1>HisabSaathi</h1><p class="muted">दुकान का पूरा हिसाब, एक साथी के साथ।</p><h2>अपनी भाषा चुनें</h2><input id="langq" placeholder="भाषा खोजें…" oninput="renderLang(this.value)"><div id="langs" class="langlist" style="margin-top:12px"></div></div></div>';renderLang('')}function renderLang(q){const a=LANGS.filter(x=>(x[1]+' '+x[0]).toLowerCase().includes(q.toLowerCase()));langs.innerHTML=a.map(x=>'<button class="lang" onclick="setLang(\''+x[0]+'\')">'+x[1]+'</button>').join('')}function setLang(code){lang=code;localStorage.setItem('hs_lang',code);if(!shop)setup();else render()}function setup(){app.innerHTML='<div class="wrap"><div class="card" style="max-width:650px;margin:30px auto"><h1>दुकान की शुरुआत करें</h1><p class="muted">सिर्फ एक बार जानकारी भरें।</p><div class="field"><label>दुकान का नाम *</label><input id="shopname"></div><div class="field"><label>मालिक का नाम</label><input id="owner"></div><div class="field"><label>पता</label><input id="address"></div><div class="field"><label>भाषा</label><select id="language">'+LANGS.map(x=>'<option value="'+x[0]+'" '+(x[0]===lang?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div><button class="btn" onclick="createShop()">डेमो शुरू करें</button><p class="muted">⏱️ डेमो 24 घंटे। फिर ₹149 / 30 दिन Premium.</p></div></div>'}async function createShop(){try{const j=await api('/shops',{method:'POST',body:JSON.stringify({name:$('#shopname').value,owner_name:$('#owner').value,address:$('#address').value,language:$('#language').value})});token=j.access_token;shop=j.shop;localStorage.setItem('hs_token',token);localStorage.setItem('hs_shop',JSON.stringify(shop));render()}catch(e){alert(e.message)}}async function render(){if(!token||!shop)return lang?setup():chooseLang();try{const m=await api('/me');shop=m.shop;localStorage.setItem('hs_shop',JSON.stringify(shop));if(!m.access.active)return locked()}catch(e){if(e.status===402)return locked();return setup()}const a=await api('/dashboard');app.innerHTML='<div class="top"><div class="brand">HisabSaathi</div><div class="row"><span class="badge">'+esc(shop.profile_id)+'</span><button class="btn yellow" onclick="premium()">₹149 Premium</button></div></div><div class="wrap"><div class="card"><h2>नमस्ते, '+esc(shop.owner_name||shop.name)+' 👋</h2><p class="muted">Bill banao. Stock sambhalo. Udhaar likho. Paisa follow-up karo.</p><div class="grid"><div class="stat">Customers<b>'+a.customers+'</b></div><div class="stat">Stock items<b>'+a.products+'</b></div><div class="stat">कुल उधार<b>'+money(a.udhaar)+'</b></div><div class="stat">इस महीने की बिक्री<b>'+money(a.sales)+'</b></div></div></div><div class="row" style="margin:18px 0"><button class="btn alt" onclick="home()">Dashboard</button><button class="btn alt" onclick="customers()">Customers</button><button class="btn alt" onclick="stock()">Stock</button><button class="btn alt" onclick="billing()">Billing</button><button class="btn alt" onclick="settings()">Settings</button></div><div id="content"></div></div>' ;home()}function home(){content.innerHTML='<div class="grid2"><div class="card"><h3>⚡ Quick Actions</h3><div class="row"><button class="btn" onclick="addCustomer()">+ Customer</button><button class="btn" onclick="billing()">+ Bill</button><button class="btn alt" onclick="stock()">+ Stock</button></div></div><div class="card"><h3>🔔 Udhaar collection</h3><p class="muted">Customer phone required रहेगा। WhatsApp reminder खोलकर भेज सकते हैं; background auto-send के लिए WhatsApp Business API credentials चाहिए।</p></div></div>'}async function customers(){const j=await api('/customers');content.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><h2>Customers</h2><button class="btn" onclick="addCustomer()">+ Customer</button></div><table class="table"><tr><th>Name</th><th>Phone</th><th>Udhaar Baaki</th><th>Action</th></tr>'+j.customers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td><td>'+money(c.credit_balance/100)+'</td><td><button class="btn alt" onclick="wa(\''+encodeURIComponent(c.phone)+'\',\''+encodeURIComponent(c.name)+'\',\''+(c.credit_balance/100)+'\')">WhatsApp</button> <button class="btn alt" onclick="collect(\''+c.id+'\')">Collect</button></td></tr>').join('')+'</table></div>'}function addCustomer(){modal.innerHTML='<div class="modal"><div class="card"><h2>Customer जोड़ें</h2><div class="field"><label>Customer Name *</label><input id="cn"></div><div class="field"><label>Phone Number *</label><input id="cp" inputmode="tel"></div><div class="field"><label>Kitna Udhaar Baaki Hai? (optional)</label><input id="cu" type="number" min="0" value="0"></div><div class="field"><label>Due Date (optional)</label><input id="cd" type="date"></div><div class="field"><label><input id="cr" type="checkbox"> Auto reminder queue करें</label></div><div class="row"><button class="btn" onclick="saveCustomer()">Save Customer</button><button class="btn alt" onclick="modal.innerHTML=\'\'">Cancel</button></div></div></div>'}async function saveCustomer(){try{await api('/customers',{method:'POST',body:JSON.stringify({name:$('#cn').value,phone:$('#cp').value,opening_udhaar:$('#cu').value,due_date:$('#cd').value||null,auto_reminder:$('#cr').checked})});modal.innerHTML='';customers()}catch(e){alert(e.message)}}function wa(p,n,b){const msg=encodeURIComponent('Namaste '+decodeURIComponent(n)+' ji, aapka '+money(b)+' udhaar baki hai. Kripya payment kar dein. - '+shop.name);window.open('https://wa.me/'+decodeURIComponent(p).replace(/\D/g,'')+'?text='+msg,'_blank')}async function collect(id){const a=prompt('Kitna payment mila? ₹');if(!a)return;try{await api('/customers/'+id+'/payment',{method:'POST',body:JSON.stringify({amount:a,method:'cash'})});customers()}catch(e){alert(e.message)}}async function stock(){const j=await api('/products');content.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><h2>Stock</h2><button class="btn" onclick="addProduct()">+ Item</button></div><table class="table"><tr><th>Item</th><th>Price</th><th>Stock</th></tr>'+j.products.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+money(p.price/100)+'</td><td>'+p.stock+'</td></tr>').join('')+'</table></div>'}function addProduct(){modal.innerHTML='<div class="modal"><div class="card"><h2>Stock Item</h2><div class="field"><label>Item Name *</label><input id="pn"></div><div class="field"><label>Price</label><input id="pp" type="number"></div><div class="field"><label>Quantity</label><input id="pq" type="number" value="0"></div><div class="row"><button class="btn" onclick="saveProduct()">Save</button><button class="btn alt" onclick="modal.innerHTML=\'\'">Cancel</button></div></div></div>'}async function saveProduct(){try{await api('/products',{method:'POST',body:JSON.stringify({name:$('#pn').value,price:$('#pp').value,stock:$('#pq').value})});modal.innerHTML='';stock()}catch(e){alert(e.message)}}async function billing(){const p=await api('/products');const c=await api('/customers');content.innerHTML='<div class="card"><h2>Simple Bill</h2><div id="billitems"></div><button class="btn alt" onclick="addBillItem()">+ Item</button><div class="field"><label>Customer (optional)</label><select id="bc"><option value="">Walk-in</option>'+c.customers.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>Paid Today ₹</label><input id="paid" type="number" value="0"></div><button class="btn" onclick="saveBill()">Create Bill</button><p class="muted">GST/Tax fields intentionally नहीं हैं।</p><div id="plist" class="hidden">'+p.products.map(x=>'<option data-price="'+x.price/100+'" value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</div></div>';addBillItem()}function addBillItem(){const box=$('#billitems'),d=document.createElement('div');d.className='grid2';d.innerHTML='<div class="field"><label>Item</label><select class="bi"><option value="">Choose</option>'+$('#plist').innerHTML+'</select></div><div class="field"><label>Qty</label><input class="bq" type="number" value="1" min="1"></div>';box.appendChild(d)}async function saveBill(){const rows=[...document.querySelectorAll('#billitems>div')];const items=rows.map(r=>{const s=r.querySelector('.bi'),q=r.querySelector('.bq'),o=s.options[s.selectedIndex];return{product_id:s.value||null,name:o?.text||'Item',qty:Number(q.value),unit_price:Number(o?.dataset.price||0)}}).filter(x=>x.name!=='Choose');try{const j=await api('/invoices',{method:'POST',body:JSON.stringify({customer_id:$('#bc').value||null,items,paid:$('#paid').value})});alert('Bill created. Total '+money(j.total)+' | Udhaar '+money(j.credit));home()}catch(e){alert(e.message)}}function settings(){content.innerHTML='<div class="card"><h2>Settings</h2><p>Profile ID: <b>'+esc(shop.profile_id)+'</b></p><p>Status: <span class="badge">'+esc(shop.subscription_status)+'</span></p><button class="btn yellow" onclick="premium()">₹149 Premium / 30 days</button></div>'}async function premium(){try{const j=await api('/subscriptions/order',{method:'POST',body:'{}'});modal.innerHTML='<div class="modal"><div class="card premium"><h2>₹149 Premium — 30 Days</h2><p>Profile ID: <b>'+esc(j.profile_id)+'</b></p><img class="qr" src="/assets/hisabsaathi-upi-qr.jpeg" onerror="this.src=\'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=upi%3A%2F%2Fpay%3Fpa%3D6206769679%2540nyes%26pn%3DHisabSaathi%26am%3D149%26cu%3DINR\'"><p><b>UPI ID:</b> 6206769679@nyes</p><p class="muted">₹149 exactly pay करें। Receipt screenshot और UTR submit करें। Screenshot alone Premium activate नहीं करता.</p><div class="field"><label>UTR / Transaction ID *</label><input id="utr"></div><div class="field"><label>Payment Receipt *</label><input id="receipt" type="file" accept="image/*"></div><button class="btn" onclick="claim(\''+j.order_id+'\')">Receipt Submit करें</button><button class="btn alt" onclick="modal.innerHTML=\'\'">Cancel</button></div></div>'}catch(e){alert(e.message)}}async function claim(order){const f=$('#receipt').files[0];if(!f)return alert('Receipt upload करें');const reader=new FileReader();reader.onload=async()=>{try{const j=await api('/subscriptions/claim',{method:'POST',body:JSON.stringify({order_id:order,utr:$('#utr').value,screenshot_data_url:reader.result})});modal.innerHTML='<div class="modal"><div class="card"><h2>Payment Submitted ✅</h2><p>Profile ID: <b>'+esc(j.profile_id)+'</b></p><p>'+esc(j.message)+'</p><button class="btn" onclick="modal.innerHTML=\'\';render()">OK</button></div></div>'}catch(e){alert(e.message)}};reader.readAsDataURL(f)}function locked(){app.innerHTML='<div class="top"><div class="brand">HisabSaathi</div><span class="badge">'+esc(shop?.profile_id||'')+'</span></div><div class="wrap"><div class="card hero premium"><h1>आपका Demo समाप्त हो गया है 🔒</h1><p>24 घंटे का demo पूरा हो चुका है। आगे जारी रखने के लिए ₹149 / 30 days Premium लें.</p><button class="btn yellow" onclick="premium()">₹149 Premium Unlock</button><p class="muted">Payment receipt + UTR submit होगा। Owner verification के बाद Premium activate होगा.</p></div></div>'}if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});if(!lang)chooseLang();else if(!shop)setup();else render();</script></body></html>
