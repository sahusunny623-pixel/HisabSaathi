name: Fix WhatsApp automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Fix WhatsApp automation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WhatsApp sender
        run: python3 scripts/patch_whatsapp.py
      - name: Validate server syntax
        run: node --check server/index.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix WhatsApp automation"
          git push
